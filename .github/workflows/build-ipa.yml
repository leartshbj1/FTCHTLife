name: Fabriquer le .ipa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les fichiers JSON
        run: |
          for f in $(find FTCHTLife/Resources/Data -name '*.json'); do
            python3 -m json.tool "$f" > /dev/null || { echo "JSON invalide : $f"; exit 1; }
          done

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -project FTCHTLife.xcodeproj \
            -scheme FTCHTLife \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Emballer le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FTCHTLife.app Payload/
          zip -qry FTCHTLife.ipa Payload
          ls -lh FTCHTLife.ipa

      - name: Garder le .ipa (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: FTCHTLife-ipa
          path: FTCHTLife.ipa

      - name: Publier une version téléchargeable
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FTCHTLife build ${{ github.run_number }}
          body: "Fichier .ipa non signé. À signer avec Sideloadly (ou un outil similaire) avant de l'installer."
          files: FTCHTLife.ipa
          make_latest: true
